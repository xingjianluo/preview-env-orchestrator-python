[project]
name = "preview-env-orchestrator-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
log_cli = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
